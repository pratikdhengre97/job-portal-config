server:
  port: 6000

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

gemini:
  api:
    key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash-lite
    max-output-tokens: 2048
    temperature: 0.7